name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Declared rather than inherited, as in integrity-sharp: nothing here writes,
# and release.yml publishes with PACKAGES_TOKEN rather than GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools (coverlet.console)
        run: dotnet tool restore

      # The solution without the MAUI project, which needs the Android
      # workload and is built in its own job below.
      - name: Build library, tests and specs
        run: |
          dotnet build TheBleedingDeacons.Freedom.Client/TheBleedingDeacons.Freedom.Client.csproj --configuration Release
          dotnet build TheBleedingDeacons.Freedom.Tests/TheBleedingDeacons.Freedom.Tests.csproj --configuration Debug
          dotnet build TheBleedingDeacons.Freedom.Specs/TheBleedingDeacons.Freedom.Specs.csproj --configuration Debug

      # Formatting and the StyleCop / Meziantou analyzers (.editorconfig), for
      # everything but the MAUI project, which cannot be restored without its
      # workload and is formatted in the maui job.
      - name: Verify formatting (dotnet format --verify-no-changes)
        run: |
          dotnet format TheBleedingDeacons.Freedom.Client/TheBleedingDeacons.Freedom.Client.csproj --verify-no-changes
          dotnet format TheBleedingDeacons.Freedom.Models/TheBleedingDeacons.Freedom.Models.csproj --verify-no-changes
          dotnet format TheBleedingDeacons.Freedom.Tests/TheBleedingDeacons.Freedom.Tests.csproj --verify-no-changes
          dotnet format TheBleedingDeacons.Freedom.Specs/TheBleedingDeacons.Freedom.Specs.csproj --verify-no-changes

      # coverlet.console around the Microsoft.Testing.Platform executable, as in
      # integrity-sharp: coverlet's collector hooks VSTest, which MTP does not use.
      - name: Test with coverage
        run: >
          dotnet coverlet TheBleedingDeacons.Freedom.Tests/bin/Debug/net10.0/TheBleedingDeacons.Freedom.Tests.dll
          --target dotnet
          --targetargs "TheBleedingDeacons.Freedom.Tests/bin/Debug/net10.0/TheBleedingDeacons.Freedom.Tests.dll"
          --format cobertura
          --output coverage/coverage.cobertura.xml
          --include "[TheBleedingDeacons.Freedom.Client]*"
          --include "[TheBleedingDeacons.Freedom.Models]*"

      # The executable specification: a gate, and deliberately not counted in
      # coverage, so the badge keeps meaning what it meant (Link's practice).
      - name: Specs
        run: dotnet TheBleedingDeacons.Freedom.Specs/bin/Debug/net10.0/TheBleedingDeacons.Freedom.Specs.dll

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.cobertura.xml
          format: cobertura
          fail-on-error: false

      # The proof that Freedom.Client stands alone: an app that references
      # nothing else of this suite's.
      - name: Verify example formatting
        working-directory: example
        run: dotnet format Freedom-cli/Freedom-cli.sln --verify-no-changes

      - name: Build example CLI
        working-directory: example
        run: dotnet build Freedom-cli/Freedom-cli.sln --configuration Release

  maui:
    name: MAUI adapter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android

      - name: Build Freedom.Client.Maui
        run: dotnet build TheBleedingDeacons.Freedom.Client.Maui/TheBleedingDeacons.Freedom.Client.Maui.csproj --configuration Release

      - name: Verify formatting
        run: dotnet format TheBleedingDeacons.Freedom.Client.Maui/TheBleedingDeacons.Freedom.Client.Maui.csproj --verify-no-changes

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    # A job of its own, as in integrity-sharp: the build jobs install the .NET
    # SDK and a MAUI workload, none of which Semgrep needs. `semgrep ci` is
    # diff-aware on a pull request; which findings block is the Block policy in
    # Semgrep, not this file.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo 'SEMGREP_APP_TOKEN is not set - skipping the scan.'
            echo 'Set it as an organisation secret to enable this gate.'
            exit 0
          fi
          python3 -m pip install --quiet semgrep==1.174.0
          semgrep ci
